version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.app
    ports:
      - "8000:8000"
    volumes:
      # CRITICAL: Allow container to control host Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount source for hot-reloading during dev
      - ./src:/app/src
    env_file:
      - .env